<ion-card>
  <ion-card-content class="fila">
    <div class="texto">
      <p>“{{ cita.frase }}”</p>
      <ion-card-subtitle>— {{ cita.autor }}</ion-card-subtitle>
    </div>
    @if (permitirBorrar) {
      <ion-button fill="clear" color="danger" aria-label="Borrar cita" (click)="alBorrar()">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    }
  </ion-card-content>
</ion-card>
