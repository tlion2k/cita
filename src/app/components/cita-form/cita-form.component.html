<form [formGroup]="form" (ngSubmit)="enviar()">
  <ion-input label="Frase" labelPlacement="floating" fill="outline" formControlName="frase"></ion-input>
  @if (error('frase')) { <ion-text color="danger"><small>{{ error('frase') }}</small></ion-text> }

  <ion-input label="Autor" labelPlacement="floating" fill="outline" formControlName="autor" class="ion-margin-top"></ion-input>
  @if (error('autor')) { <ion-text color="danger"><small>{{ error('autor') }}</small></ion-text> }

  <ion-button type="submit" expand="block" class="ion-margin-top">Agregar cita</ion-button>
</form>
